<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="joke-container">
            <div class="header">
                <h1>😂 Joke Generator</h1>
                <p>Get a random joke to brighten your day!</p>
            </div>

            <div class="joke-display">
                <div id="jokeText" class="joke-text">Click "Get Joke" to start laughing!</div>
                <div id="jokeType" class="joke-type"></div>
            </div>

            <div class="controls">
                <button id="getJokeBtn" class="btn btn-primary">Get Joke</button>
                <button id="copyBtn" class="btn btn-secondary">Copy</button>
                <button id="shareBtn" class="btn btn-secondary">Share</button>
            </div>

            <div class="filters">
                <label for="jokeCategory">Category:</label>
                <select id="jokeCategory">
                    <option value="random">Random</option>
                    <option value="general">General</option>
                    <option value="programming">Programming</option>
                    <option value="knock-knock">Knock-Knock</option>
                </select>
            </div>

            <div class="history-section">
                <h2>Favorite Jokes</h2>
                <div id="historyList" class="history-list"></div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading joke...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
